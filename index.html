  <script>
    'use strict';

    /* ================================================================
     * 날짜 유틸
     * ================================================================ */
    var WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];

    function parseDate(str) {
      if (!str) return null;
      var parts = str.split('-');
      if (parts.length !== 3) return null;
      var y = +parts[0], m = +parts[1], d = +parts[2];
      if (!y || !m || !d || m < 1 || m > 12 || d < 1) return null;
      var date = new Date(y, m - 1, d);
      if (date.getFullYear() !== y || date.getMonth() !== m - 1 || date.getDate() !== d) return null;
      return date;
    }
    function pad2(n) { return String(n).padStart(2, '0'); }
    function toInputValue(date) { return date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate()); }
    function today() { var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
    function addDays(date, n) { var r = new Date(date); r.setDate(r.getDate() + n); return r; }
    function addMonthsSafe(date, months) {
      var r = new Date(date.getFullYear(), date.getMonth(), 1);
      r.setMonth(r.getMonth() + months);
      var last = new Date(r.getFullYear(), r.getMonth() + 1, 0).getDate();
      r.setDate(Math.min(date.getDate(), last));
      return r;
    }
    function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
    function weekdayOf(date) { return WEEKDAYS[date.getDay()]; }
    function fmtLong(date) { return date.getFullYear() + '년 ' + (date.getMonth() + 1) + '월 ' + date.getDate() + '일 ' + weekdayOf(date) + '요일'; }
    function fmtDot(date) { return date.getFullYear() + '.' + pad2(date.getMonth() + 1) + '.' + pad2(date.getDate()); }

    /* ================================================================
     * 유연한 날짜 입력 (직접 타이핑 + 달력 팝업 공용)
     *  - YYYY-MM-DD / YYYYMMDD / YYYY.M.D 등 다양한 형태 허용
     *  - 타이핑 중 자동으로 YYYY-MM-DD 형태로 정리
     * ================================================================ */
    function formatDateInput(raw) {
      var d = String(raw || '').replace(/\D/g, '').slice(0, 8);
      if (d.length <= 4) return d;
      if (d.length <= 6) return d.slice(0, 4) + '-' + d.slice(4);
      return d.slice(0, 4) + '-' + d.slice(4, 6) + '-' + d.slice(6, 8);
    }

    function parseFlexible(str) {
      if (!str) return null;
      var s = String(str).trim();
      var compact = s.replace(/[-./\s]/g, '');
      if (/^\d{8}$/.test(compact)) {
        return parseDate(compact.slice(0, 4) + '-' + compact.slice(4, 6) + '-' + compact.slice(6, 8));
      }
      return parseDate(s);
    }

    var DATE_COMMITS = {};

    function bindFlexDate(inputId, commit) {
      DATE_COMMITS[inputId] = commit;
      var input = el(inputId);
      input.addEventListener('input', function (e) {
        var v = formatDateInput(e.target.value);
        if (v !== e.target.value) e.target.value = v;
        var d = parseFlexible(v);
        commit(d ? toInputValue(d) : v);
        toggleResetBtn(inputId, v !== '');
      });
    }

    function toggleResetBtn(inputId, show) {
      var btn = document.querySelector('[data-reset-for="' + inputId + '"]');

          DPK.m -= 1; if (DPK.m < 0) { DPK.m = 11; DPK.y -= 1; }
          DPK_EL.innerHTML = dpkInner(); renderIcons();
        } else if (act === 'next') {

          DPK_EL.innerHTML = dpkInner(); renderIcons();
        } else if (act === 'day') {

          var td = today();
          DPK.y = td.getFullYear(); DPK.m = td.getMonth();

    function getManAge(birth, now) {
      var age = now.getFullYear() - birth.getFullYear();

      if (monthDiff < 0 || (monthDiff === 0 && now.getDate() < birth.getDate())) age -= 1;
      return age;

        var birthYear = currentYear - manAge;
        if (getZodiacByYear(birthYear).key === zodiac.key) {

    /* ================================================================
     * 음력 변환 (lunar-javascript — 브라우저 전역 Solar/Lunar)
     * ================================================================ */
    function isValidYmd(y, m, d) {
      if (!Number.isInteger(y) || !Number.isInteger(m) || !Number.isInteger(d)) return false;
      if (m < 1 || m > 12 || d < 1) return false;
      return d <= new Date(y, m, 0).getDate();
    }
    function solarToLunar(y, m, d) {
      if (typeof Solar === 'undefined' || typeof Lunar === 'undefined') throw new Error('lunar lib not loaded');
      if (!isValidYmd(y, m, d)) throw new Error('invalid solar date');
      var solar = Solar.fromYmd(y, m, d);
      var lunar = solar.getLunar();
      var lm = lunar.getMonth(); // 윤달이면 음수
      return {
        year: lunar.getYear(),
        month: Math.abs(lm),
        day: lunar.getDay(),
        isLeap: lm < 0,
        ganZhi: lunar.getYearInGanZhi(),
        dayCn: lunar.getDayInChinese()
      };
    }
    function lunarToSolar(y, m, d, isLeap) {
      if (typeof Lunar === 'undefined' || typeof Solar === 'undefined') throw new Error('lunar lib not loaded');
      if (!Number.isInteger(y) || !Number.isInteger(m) || !Number.isInteger(d)) throw new Error('invalid');
      if (m < 1 || m > 12 || d < 1 || d > 30) throw new Error('invalid lunar date');
      var lunar = Lunar.fromYmd(y, m, d, !!isLeap);
      var solar = lunar.getSolar();
      var back = solar.getLunar();
      if (!!isLeap !== (back.getMonth() < 0)) throw new Error('no such leap month');
      return {
        year: solar.getYear(),
        month: solar.getMonth(),
        day: solar.getDay(),
        weekday: solar.getWeekInChinese(),
        ganZhi: back.getYearInGanZhi(),
        lunarYear: back.getYear()
      };
    }

    function humanize(n) {
      var sign = n < 0 ? '-' : '';
      var abs = Math.abs(n);
      var years = Math.floor(abs / 365);
      var months = Math.floor((abs % 365) / 30);
      var days = abs % 30;
      var parts = [];
      if (years > 0) parts.push(years + '년');
      if (months > 0) parts.push(months + '개월');
      parts.push(days + '일');
      return sign + parts.join(' ');
    }

    function ddayBadge(n) {
      if (n > 0) return badge('emerald', 'D-' + n);
      if (n === 0) return badge('rose', 'D-Day 🎉');
      return badge('slate', 'D+' + (-n));
    }

    function updateDdayResults() {
      updateSegmented('dd-mode', state.ddMode);
      updateChips();
      var isAdd = state.ddMode === 'add';
      el('dd-add').classList.toggle('hidden', !isAdd);
      el('dd-dday').classList.toggle('hidden', isAdd);

      if (isAdd) {
        var base = parseDate(state.ddBase);
        var slot = el('dd-add-result');
        if (!base) { slot.innerHTML = ''; return; }
        var target = addDays(base, state.ddDays);
        var dFromToday = daysBetween(NOW, target);
        var signDays = state.ddDays > 0 ? '+' : '';
        slot.innerHTML =
          '<div class="animate-fade-up mt-5 rounded-2xl border border-emerald-200 bg-gradient-to-br from-emerald-50 to-teal-50 p-5">' +
          '<div class="flex items-center gap-1.5 text-xs font-bold text-emerald-600">' +
          '<span>' + fmtDot(base) + '</span>' + ICON('arrow-right', 'w-3.5 h-3.5') + '<span>' + signDays + state.ddDays + '일</span></div>' +
          '<div class="mt-1.5 flex flex-wrap items-baseline gap-x-2 gap-y-1">' +
          '<span class="text-3xl font-black tracking-tight text-emerald-900">' + fmtDot(target) + '</span>' +
          '<span class="text-sm font-bold text-emerald-600">(' + weekdayOf(target) + ')</span></div>' +
          '<div class="mt-2 flex flex-wrap items-center gap-1.5">' +
          '<span class="text-xs font-semibold text-emerald-700">오늘 기준</span>' + ddayBadge(dFromToday) +
          (Math.abs(dFromToday) > 0 ? '<span class="text-[11px] text-emerald-600/80">약 ' + humanize(dFromToday) + '</span>' : '') +
          '</div></div>';
      } else {
        var target2 = parseDate(state.ddTarget);
        var slot2 = el('dd-dday-result');
        if (!target2) { slot2.innerHTML = ''; return; }
        var diff = daysBetween(NOW, target2);
        var hero;
        if (diff > 0) {
          hero = '<div class="text-xs font-bold text-emerald-600">목표일까지</div>' +
                 '<div class="mt-1 text-6xl font-black tracking-tight text-emerald-600">D-' + diff + '</div>';
        } else if (diff === 0) {
          hero = '<div class="text-xs font-bold text-rose-500">오늘이 바로 그날!</div>' +
                 '<div class="mt-1 flex items-center justify-center gap-2 text-4xl font-black text-rose-500">D-Day ' + ICON('party-popper', 'w-8 h-8') + '</div>';
        } else {
          hero = '<div class="text-xs font-bold text-slate-500">이미 지난 날</div>' +
                 '<div class="mt-1 text-6xl font-black tracking-tight text-slate-500">D+' + (-diff) + '</div>';
        }
        slot2.innerHTML =
          '<div class="animate-fade-up mt-5 rounded-2xl border border-slate-200 bg-gradient-to-br from-slate-50 to-white p-6 text-center">' +
          hero +
          '<div class="mt-3 text-sm font-semibold text-slate-600">' + fmtLong(target2) + '</div>' +
          '<div class="mt-1 text-xs text-slate-400">오늘 ' + fmtDot(NOW) + ' 기준 · 약 ' + humanize(diff) + '</div>' +
          '</div>';
      }
      renderIcons();
    }

    /* ================================================================

        statCard('heart', 'rose', '세는 나이', koreanAge + '세') +

        '<div class="flex h-16 w-16 shrink-0 items-center justify-center rounded-2xl border text-4xl ' + zodiac.idle + '">' + zodiac.emoji + '</div>' +
        '<div class="min-w-0">' +
        '<div class="flex flex-wrap items-center gap-2">' +

    /* ================================================================
     * 탭 4: 띠별 생년/나이 대조표
     * ================================================================ */
    function updateZodiacButtons() {
      for (var i = 0; i < ZODIACS.length; i++) {
        var z = ZODIACS[i];

        if (!btn) continue;
        var active = state.zzKey === z.key;

        btn.setAttribute('aria-pressed', active);
      }

    function updateZodiacResults() {
      updateZodiacButtons();

      var q = state.zzQuery.trim();

      // ★ 실시간 생년 검색: 4자리 년도 입력 즉시 해당 띠로 동기화
      var yearQ = /^\d{4}$/.test(q) ? parseInt(q, 10) : -1;
      var liveZodiac = null;
      if (yearQ >= CURRENT_YEAR - 100 && yearQ <= CURRENT_YEAR) {
        liveZodiac = getZodiacByYear(yearQ);
        if (state.zzKey !== liveZodiac.key) {
          state.zzKey = liveZodiac.key;
          updateZodiacButtons();
        }
      }

      var zodiac = null;
      for (var i = 0; i < ZODIACS.length; i++) { if (ZODIACS[i].key === state.zzKey) { zodiac = ZODIACS[i]; break; } }
      var rows = buildZodiacRows(zodiac, CURRENT_YEAR);
      var filtered;
      if (!q) {
        filtered = rows;
      } else {
        filtered = [];
        for (var j = 0; j < rows.length; j++) {
          var r = rows[j];
          if (String(r.birthYear).indexOf(q) >= 0 || String(r.manAge) === q || String(r.yearAge) === q) filtered.push(r);
        }
      }
      var latest = rows.length > 0 ? rows[0] : null;

      // ★ 실시간 결과 카드 (입력창 바로 아래)
      var liveHtml = '';
      if (liveZodiac) {
        var gan = getGanZhi(yearQ);
        var mAge = CURRENT_YEAR - yearQ;
        var kAge = mAge + 1;
        liveHtml =
          '<div class="animate-fade-up mt-3 flex items-center gap-3 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">' +
          '<div class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl border text-3xl ' + liveZodiac.idle + '">' + liveZodiac.emoji + '</div>' +
          '<div class="min-w-0 flex-1">' +
          '<div class="flex flex-wrap items-center gap-2">' +
          '<span class="text-base font-extrabold text-slate-800">' + yearQ + '년생</span>' +
          badge('amber', liveZodiac.name + '띠') +
          badge('emerald', gan + '년') +
          '</div>' +
          '<div class="mt-1.5 flex flex-wrap items-center gap-x-3 gap-y-1 text-xs font-semibold text-slate-500">' +
          '<span>만 ' + mAge + '세</span>' +
          '<span>연 ' + mAge + '세</span>' +
          '<span class="text-slate-400">세는 나이 ' + kAge + '세</span>' +
          '</div>' +
          '</div>' +
          '<div class="shrink-0 text-right">' +
          '<div class="text-[10px] font-bold text-slate-400">세차(간지)</div>' +
          '<div class="mt-0.5 text-xl font-black text-amber-600">' + gan + '</div>' +
          '</div>' +
          '</div>';
      }
      el('zz-live').innerHTML = liveHtml;

      el('zz-summary').innerHTML =
        '<div class="mt-4 flex flex-wrap items-center justify-between gap-2 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3">' +
        '<div class="flex items-center gap-2 text-sm font-bold text-emerald-800">' +
        '<span class="text-xl leading-none">' + zodiac.emoji + '</span>' + zodiac.name + '띠 · ' + CURRENT_YEAR + '년 기준</div>' +
        (latest ? badge('emerald', '최근 출생 ' + latest.birthYear + '년 (만 ' + latest.manAge + '세)') : '') +
        '</div>';

      if (filtered.length > 0) {
        var rowsHtml = '';
        for (var k = 0; k < filtered.length; k++) {
          var row = filtered[k];
          rowsHtml +=
            '<tr class="transition-colors hover:bg-emerald-50/40">' +
            '<td class="px-4 py-2.5 font-extrabold text-slate-800">' + row.birthYear + '<span class="ml-0.5 text-[11px] font-medium text-slate-400">년</span></td>' +
            '<td class="py-2.5 text-center"><span class="inline-flex min-w-[56px] items-center justify-center rounded-full bg-emerald-100 px-2 py-0.5 text-xs font-bold text-emerald-700">' + row.manAge + '세</span></td>' +
            '<td class="py-2.5 text-center text-slate-600">' + row.yearAge + '세</td>' +
            '<td class="py-2.5 pr-4 text-right"><span class="text-xs font-semibold text-slate-600">' + zodiac.emoji + ' ' + zodiac.name + '띠</span></td>' +
            '</tr>';
        }
        el('zz-table').innerHTML =
          '<div class="mt-4 max-h-96 overflow-y-auto rounded-2xl border border-slate-200">' +
          '<table class="w-full text-sm">' +
          '<thead class="sticky top-0 z-10 bg-slate-50 text-xs text-slate-500">' +
          '<tr>' +
          '<th class="px-4 py-2.5 text-left font-bold">년생</th>' +
          '<th class="py-2.5 text-center font-bold">만 나이</th>' +
          '<th class="py-2.5 text-center font-bold">연 나이</th>' +
          '<th class="py-2.5 pr-4 text-right font-bold">띠</th>' +
          '</tr></thead>' +
          '<tbody class="divide-y divide-slate-100 bg-white">' + rowsHtml + '</tbody>' +
          '</table></div>';
      } else {
        el('zz-table').innerHTML =
          '<div class="mt-4 rounded-2xl border border-dashed border-slate-200 bg-slate-50/60 p-6 text-center text-sm text-slate-500">검색 결과가 없습니다 🕵️</div>';
      }
      renderIcons();
    }

    /* ================================================================
     * 탭 5: 전역일 계산기
     * ================================================================ */
    function updateBranchButtons() {
      for (var i = 0; i < BRANCHES.length; i++) {
        var b = BRANCHES[i];
        var btn = el('mil-btn-' + b.key);
        if (!btn) continue;
        var active = state.milBranch === b.key;
        btn.className = 'flex flex-col items-center gap-1 rounded-xl border px-2 py-3 transition-all duration-200 active:scale-95 ' + (active ? b.active : b.idle);
        btn.setAttribute('aria-pressed', active);
      }
    }

    function updateMilitaryResults() {
      updateBranchButtons();

      var enlist = parseDate(state.milDate);
      var slot = el('mil-result');
      if (!enlist) { slot.innerHTML = ''; return; }

      var branch = null;
      for (var i = 0; i < BRANCHES.length; i++) { if (BRANCHES[i].key === state.milBranch) { branch = BRANCHES[i]; break; } }

      var discharge = addMonthsSafe(enlist, branch.months);
      var total = Math.max(1, daysBetween(enlist, discharge));
      var served = Math.max(0, daysBetween(enlist, NOW));
      var remaining = daysBetween(NOW, discharge);
      var pct = Math.min(100, Math.max(0, Math.round((served / total) * 100)));
      var status = NOW < enlist ? 'before' : (NOW >= discharge ? 'done' : 'serving');

      var mainHtml;
      if (status === 'done') {
        mainHtml =
          '<div class="flex items-center gap-3 rounded-2xl border border-emerald-200 bg-gradient-to-br from-emerald-50 to-teal-50 p-5">' +
          '<div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-emerald-500 text-white shadow-lg shadow-emerald-500/30">' + ICON('party-popper', 'w-6 h-6') + '</div>' +
          '<div>' +
          '<div class="text-lg font-extrabold text-emerald-700">전역 완료! 🎉</div>' +
          '<div class="text-sm text-emerald-600">' + fmtLong(discharge) + '에 전역하셨어요.</div>' +
          '</div></div>';
      } else {
        mainHtml =
          '<div class="rounded-2xl border border-slate-200 bg-gradient-to-br from-slate-50 to-white p-5">' +
          '<div class="flex items-center justify-between">' +
          '<span class="text-xs font-bold text-slate-500">전역 예정일</span>' +
          (status === 'before' ? badge('sky', '입대 전') : badge('emerald', '복무 중')) +
          '</div>' +
          '<div class="mt-1 flex flex-wrap items-baseline gap-x-2 gap-y-1">' +
          '<span class="text-3xl font-black tracking-tight text-slate-800">' + fmtDot(discharge) + '</span>' +
          '<span class="text-sm font-semibold text-slate-500">(' + weekdayOf(discharge) + ')</span>' +
          (status === 'serving' ? badge('emerald', 'D-' + remaining) : '') +
          '</div>' +
          '<div class="mt-4">' +
          '<div class="mb-1.5 flex items-center justify-between text-xs font-bold">' +
          '<span class="text-slate-500">복무 진행률</span>' +
          '<span class="text-emerald-600">' + pct + '%</span>' +
          '</div>' +
          '<div class="h-4 w-full overflow-hidden rounded-full bg-slate-100">' +
          '<div class="h-full rounded-full bg-gradient-to-r from-emerald-400 via-teal-400 to-emerald-500 transition-all duration-700" style="width:' + pct + '%"></div>' +
          '</div>' +
          (status === 'before' ? '<p class="mt-1.5 text-[11px] text-slate-400">아직 입대 전이에요. 입대일부터 진행률이 계산됩니다.</p>' : '') +
          '</div></div>';
      }

      slot.innerHTML =
        '<div class="animate-fade-up mt-5 space-y-4">' + mainHtml +
        '<div class="grid grid-cols-3 gap-3">' +
        statCard('calendar', 'sky', '총 복무일', total.toLocaleString('ko-KR'), '일') +
        statCard('timer', 'emerald', '경과일', served.toLocaleString('ko-KR'), '일') +
        statCard('clock', remaining < 0 ? 'rose' : 'amber', remaining < 0 ? '전역 후 일수' : '남은 일수', Math.abs(remaining).toLocaleString('ko-KR'), '일') +
        '</div></div>';
      renderIcons();
    }

    /* ================================================================
     * 탭 전환
     * ================================================================ */
    var TAB_ACTIVE = 'flex flex-col items-center gap-1 rounded-xl px-1 py-2.5 transition-all duration-200 active:scale-95 bg-gradient-to-br from-emerald-500 to-teal-500 text-white shadow-md shadow-emerald-500/30';
    var TAB_INACTIVE = 'flex flex-col items-center gap-1 rounded-xl px-1 py-2.5 transition-all duration-200 active:scale-95 text-slate-500 hover:bg-slate-100 hover:text-slate-700';

    function updateCurrentResults() {
      switch (state.tab) {
        case 'solar': updateSolarResults(); break;
        case 'dday': updateDdayResults(); break;
        case 'age': updateAgeResults(); break;
        case 'zodiac': updateZodiacResults(); break;
        case 'military': updateMilitaryResults(); break;
      }
    }

    function switchTab(key) {
      state.tab = key;
      closeDatepicker();
      var tabButtons = document.querySelectorAll('.tab-btn');
      for (var i = 0; i < tabButtons.length; i++) {
        var btn = tabButtons[i];
        var active = btn.dataset.tab === key;
        btn.className = active ? TAB_ACTIVE : TAB_INACTIVE;
        btn.setAttribute('aria-selected', active);
      }
      var panels = document.querySelectorAll('.tab-panel');
      for (var j = 0; j < panels.length; j++) {
        var panel = panels[j];
        var show = panel.id === 'panel-' + key;
        if (show) {
          panel.classList.remove('hidden');
          panel.classList.remove('animate-fade-up');
          void panel.offsetWidth; // 애니메이션 재실행
          panel.classList.add('animate-fade-up');
        } else {
          panel.classList.add('hidden');
        }
      }
      updateCurrentResults();
    }

    /* ================================================================
     * 초기화
     * ================================================================ */
    function buildZodiacGrid() {
      var html = '';
      for (var i = 0; i < ZODIACS.length; i++) {
        var z = ZODIACS[i];
        html +=
          '<button type="button" id="zz-btn-' + z.key + '" data-zkey="' + z.key + '" class="flex flex-col items-center gap-0.5 rounded-xl border px-1 py-2.5 transition-all duration-200 active:scale-95 ' + z.idle + '">' +
          '<span class="text-2xl leading-none">' + z.emoji + '</span>' +
          '<span class="text-xs font-bold leading-none">' + z.name + '</span>' +
          '</button>';
      }
      el('zz-grid').innerHTML = html;
    }

    function buildBranchGrid() {
      var html = '';
      for (var i = 0; i < BRANCHES.length; i++) {
        var b = BRANCHES[i];
        html +=
          '<button type="button" id="mil-btn-' + b.key + '" data-bkey="' + b.key + '" class="flex flex-col items-center gap-1 rounded-xl border px-2 py-3 transition-all duration-200 active:scale-95 ' + b.idle + '">' +
          ICON(b.icon, 'w-5 h-5') +
          '<span class="text-sm font-extrabold leading-none">' + b.name + '</span>' +
          '<span class="text-[10px] font-semibold opacity-80">' + b.desc + '</span>' +
          '</button>';
      }
      el('mil-grid').innerHTML = html;
    }

    function bindEvents() {
      // 탭 바
      var tabButtons = document.querySelectorAll('.tab-btn');
      for (var i = 0; i < tabButtons.length; i++) {
        (function (btn) {
          btn.addEventListener('click', function () { switchTab(btn.dataset.tab); });
        })(tabButtons[i]);
      }

      // 탭 1: 양/음력
      var slSeg = document.querySelectorAll('[data-seg="sl-mode"]');
      for (var j = 0; j < slSeg.length; j++) {
        (function (btn) {
          btn.addEventListener('click', function () { state.slMode = btn.dataset.value; updateSolarResults(); });
        })(slSeg[j]);
      }
      bindFlexDate('sl-date', function (v) { state.slDate = v; updateSolarResults(); });
      el('sl-today').addEventListener('click', function () {
        state.slDate = toInputValue(today());
        el('sl-date').value = state.slDate;
        toggleResetBtn('sl-date', true);
        updateSolarResults();
      });
      el('sl-leap').addEventListener('change', function (e) { state.slLeap = e.target.checked; updateSolarResults(); });

      // 탭 2: 날짜/D-Day
      var ddSeg = document.querySelectorAll('[data-seg="dd-mode"]');
      for (var k = 0; k < ddSeg.length; k++) {
        (function (btn) {
          btn.addEventListener('click', function () { state.ddMode = btn.dataset.value; updateDdayResults(); });
        })(ddSeg[k]);
      }
      bindFlexDate('dd-base', function (v) { state.ddBase = v; updateDdayResults(); });
      el('dd-days').addEventListener('input', function (e) { state.ddDays = Number(e.target.value) || 0; updateDdayResults(); });
      var chips = document.querySelectorAll('[data-days]');
      for (var c = 0; c < chips.length; c++) {
        (function (btn) {
          btn.addEventListener('click', function () {
            state.ddDays = Number(btn.dataset.days);
            el('dd-days').value = state.ddDays;
            updateDdayResults();
          });
        })(chips[c]);
      }
      bindFlexDate('dd-target', function (v) { state.ddTarget = v; updateDdayResults(); });

      // 탭 3: 만 나이/띠
      bindFlexDate('age-birth', function (v) { state.ageBirth = v; updateAgeResults(); });

      // 탭 4: 띠 대조표
      var zzBtns = document.querySelectorAll('[data-zkey]');
      for (var zz = 0; zz < zzBtns.length; zz++) {
        (function (btn) {
          btn.addEventListener('click', function () {
            // 동물 아이콘 클릭 → 해당 띠 전체 목록 표시 (검색어 초기화로 충돌 방지)
            state.zzKey = btn.dataset.zkey;
            state.zzQuery = '';
            el('zz-query').value = '';
            updateZodiacResults();
          });
        })(zzBtns[zz]);
      }
      el('zz-query').addEventListener('input', function (e) { state.zzQuery = e.target.value; updateZodiacResults(); });

      // 탭 5: 전역일
      var milBtns = document.querySelectorAll('[data-bkey]');
      for (var mb = 0; mb < milBtns.length; mb++) {
        (function (btn) {
          btn.addEventListener('click', function () { state.milBranch = btn.dataset.bkey; updateMilitaryResults(); });
        })(milBtns[mb]);
      }
      bindFlexDate('mil-date', function (v) { state.milDate = v; updateMilitaryResults(); });

      // 달력 아이콘 → 팝업 열기/닫기
      var trigs = document.querySelectorAll('[data-date-trigger]');
      for (var tg = 0; tg < trigs.length; tg++) {
        (function (btn) {
          btn.addEventListener('click', function (e) { e.preventDefault(); toggleDatepicker(btn.dataset.dateTrigger); });
        })(trigs[tg]);
      }

      // 초기화(X) 버튼 → 입력값 즉시 지우기
      var resetBtns = document.querySelectorAll('[data-reset-for]');
      for (var rb = 0; rb < resetBtns.length; rb++) {
        (function (btn) {
          btn.addEventListener('click', function () {
            var id = btn.dataset.resetFor;
            var input = el(id);
            input.value = '';
            if (DATE_COMMITS[id]) DATE_COMMITS[id]('');
            toggleResetBtn(id, false);
            input.focus();
          });
        })(resetBtns[rb]);
      }
    }

    // 달력 팝업 바깥 클릭 / ESC 닫기
    document.addEventListener('click', function (e) {
      if (!DPK) return;
      if (DPK_EL.contains(e.target)) return;
      var trig = e.target.closest('[data-date-trigger]');
      if (trig && trig.dataset.dateTrigger === DPK.inputId) return;
      closeDatepicker();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeDatepicker();
    });

    function init() {
      // 헤더 오늘 정보
      var yz = getZodiacByYear(CURRENT_YEAR);
      el('today-chip').textContent = '오늘 ' + fmtLong(NOW) + ' · ' + yz.emoji + ' ' + yz.name + '띠해 (' + getGanZhi(CURRENT_YEAR) + '년)';

      // 초기 입력값 (날짜 입력창은 빈 값 + 플레이스홀더 상태)
      el('dd-days').value = state.ddDays;
      el('zz-query').placeholder = CURRENT_YEAR + '년 기준 년생·나이 검색 (예: 1996)';
      el('zz-note').textContent = CURRENT_YEAR + '년(올해)을 기준으로 만 0세 ~ 100세의 출생 연도를 계산합니다. 띠는 태어난 해(양력) 기준입니다. 4자리 생년(예: 1988)을 입력하면 바로 아래 카드에서 띠·나이·세차를 확인할 수 있어요.';

      buildZodiacGrid();
      buildBranchGrid();
      bindEvents();

      switchTab('solar');
      renderIcons();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
